name: CI

# Build the app on every push to main and every pull request, so a broken
# commit is caught here instead of on a developer's Mac. The built DMG is
# uploaded as a workflow artifact, so it can be downloaded and tested
# without a local Xcode build. Tag pushes (v*) are handled by release.yml,
# which publishes a GitHub Release instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed, no team)
        run: |
          set -euxo pipefail
          xcodebuild \
            -scheme FreeDisplay \
            -configuration Release \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build
          APP_PATH=$(find build/derived/Build/Products/Release -name "FreeDisplay.app" -type d | head -1)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Deep ad-hoc re-sign and verify
        run: |
          set -euxo pipefail
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements FreeDisplay/FreeDisplay.entitlements \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Build DMG (drag-to-Applications layout)
        run: |
          set -euxo pipefail
          STAGING=build/dmg-staging
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          DMG_PATH="build/DisplayKit-$(git rev-parse --short HEAD).dmg"
          hdiutil create \
            -volname "DisplayKit" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"
          codesign --sign - "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          ls -lah "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayKit-${{ github.sha }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
          retention-days: 14
